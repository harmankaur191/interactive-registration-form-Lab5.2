<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="script2.js" defer></script>
</head>

<body>
  <div class="container-signup-form">
    <h2>Create Account</h2>
    <form id="signupForm" novalidate>
      <div class="form-group-signup">
        <label for="username">Username:</label><input type="text" id="username" required="" minlength="5" maxlength="15"
          pattern="^[a-zA-Z0-9_]+$" name="username" /><span class="error-message-signup" id="usernameError"></span>
      </div>
      <div class="form-group-signup">
        <label for="email">Email:</label><input type="email" id="email" required="" name="email" /><span
          class="error-message-signup" id="emailError"></span>
      </div>
      <div class="form-group-signup">
        <label for="password">Password:</label><input type="password" id="password" required="" minlength="8"
          name="password" /><span class="error-message-signup" id="passwordError"></span>
          <input type="checkbox" id="show-password">Show Password</input>
      </div>
      <div class="form-group-signup">
        <label for="confirmPassword">Confirm Password:</label><input type="password" id="confirmPassword" required=""
          name="confirmPassword" /><span class="error-message-signup" id="confirmPasswordError"></span>
      </div>
      <button id="submitBtn" type="submit" class="signup-button">Sign Up</button>
    </form>
  </div>
</body>

</html>
